<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해커스 영상 추적 비서 PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- ✨ 디자인 테마 (연구소 스타일 적용) --- */
        :root {
            --main-blue: #2b6bf3;
            --light-blue: #5183F0;
            --bg-gradient: linear-gradient(135deg, #f0f4f8, #dde9ff);
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --border-radius: 20px;
            --shadow: 0 10px 20px rgba(46, 76, 178, 0.08);
            --point-yellow: #FFF6B0;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
            font-weight: 400;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* 헤더 섹션 */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--main-blue);
            display: inline-block;
            background: linear-gradient(to top, var(--point-yellow) 40%, transparent 40%);
            padding: 0 5px;
        }

        /* 입력 그룹 */
        .group {
            background: #f8fbff;
            border: 2px solid #e8f0fe;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .section-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--main-blue);
            margin-bottom: 12px;
            display: block;
        }

        .date-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #d0e2ff;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            font-weight: 600;
            color: var(--main-blue);
            outline: none;
            transition: 0.3s;
        }

        .date-input:focus {
            border-color: var(--main-blue);
            background: #fff;
            box-shadow: 0 0 10px rgba(43, 107, 243, 0.1);
        }

        /* 채널 그리드 (작은 버튼 스타일) */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 6px;
        }

        .channel-btn {
            background: #fff;
            border: 1px solid #dfe3e8;
            border-radius: 8px;
            padding: 8px 4px;
            font-size: 12px;
            color: #555;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            word-break: keep-all;
            font-weight: 500;
        }

        .channel-btn:hover {
            border-color: var(--main-blue);
            color: var(--main-blue);
            transform: translateY(-2px);
            background: #f0f5ff;
        }

        .channel-btn.active {
            background: var(--main-blue);
            color: #fff;
            border-color: var(--main-blue);
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(43, 107, 243, 0.2);
        }

        /* 로딩 애니메이션 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--main-blue);
            font-weight: bold;
        }

        .loading i {
            font-size: 30px;
            margin-bottom: 10px;
            display: block;
        }

        /* 결과 영역 */
        #resultArea {
            margin-top: 25px;
            display: none;
        }

        .count-info {
            padding: 10px 15px;
            background: #e7f0ff;
            border-radius: 8px;
            color: var(--main-blue);
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
            display: inline-block;
        }

        .video-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .video-item {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 15px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .video-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.4;
            height: 2.8em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .thumb-preview {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #f1f3f5;
        }

        .action-group {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 6px;
        }

        .action-btn {
            padding: 10px 5px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }

        .btn-link { background: #e7f0ff; color: var(--main-blue); }
        .btn-copy { background: #fff4e6; color: #fd7e14; }
        .btn-down { background: #ebfbee; color: #2f9e44; }

        .action-btn:hover {
            filter: brightness(0.95);
        }

        @media (max-width: 600px) {
            .video-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-section">
            <div class="app-title">🧪 해커스 영상 추적 비서 PRO</div>
        </div>

        <div class="group">
            <span class="section-label">📅 1. 업로드 날짜 입력</span>
            <input type="text" id="dateInput" class="date-input" placeholder="YYMMDD (예: 260403)" maxlength="6">
        </div>

        <div class="group">
            <span class="section-label">📺 2. 채널 선택</span>
            <div class="channel-grid" id="channelGrid">
                </div>
        </div>

        <div id="loading" class="loading">
            <i class="fa-solid fa-flask-vial fa-spin"></i>
            박사님, 데이터를 추출하고 있습니다...
        </div>

        <div id="resultArea">
            <div id="countInfo" class="count-info"></div>
            <div id="videoList" class="video-list"></div>
        </div>
    </div>
</div>

<script>
    const FIXED_API_KEY = 'AIzaSyAmTWQGwdwtj87FLv6JNXIAPnT1bO9-yOQ'; 

    const channels = {
        "해커스 토익": "UCTdflp7iCb0qj61On66yOAw", "해커스잡": "UCjhD0iUV1qyRJoLkwM3ignA", "해커스공무원": "UCcDz72Vic8ILPpIhcFWdkvA",
        "공인중개사": "UCdtvVo04Fn1gXe38HSszbnw", "해커스경찰": "UCH4YqIY3Gi_l-qbf_Lj2f3w", "김진태 토익": "UCW2iaEZAlpZ48jBV7Cxuoxg",
        "구자연 토익": "UCeRI1uV1_5iS-cM37LvoWOw", "토스&오픽": "UCWVqJF4TEzCscyOT_uITrmg", "민지원 토익": "UCGGkfoTumbZb5OWNMF5npBQ",
        "한나 토익": "UCG-EcAtKyA4Zful5VD_pv8A", "로스쿨·변호사": "UCNxyohrWP0-4J7aL2AzHT0A", "감평사&행정사": "UC6JhVkziP3BOqsaJeJ8cMDw",
        "해커스 PSAT": "UCB7dVWW1HajiZOqACiTrgwg", "해커스 경영": "UCMO38w-Zkx_6a-AyDrITq1A", "해커스 금융": "UCj_bvSTgaEwMfg1NpAMY0ig",
        "해커스소방": "UCG2BAw5mjP7MXoJJroUYbDw", "해커스 유학": "UCYybN6xbo2rtdb7XGqYK_-A", "해커스 일본어": "UCVsW_QS-bzIVDMChrRuBxPA",
        "해커스 임용": "UC52CZiUrhsKJX7t5bE8ZQ2Q", "해커스 자격증": "UC4REETmYtlvqHunx2tl2Pmg", "해커스 중국어": "UCBARjw2l2cbTzxQLIYwFm6w",
        "해커스톡": "UCmjwMlVeo5DoH8xCmMQlVgA", "해커스 편입": "UCoLlc4K-jpTorSHvwH9cEQQ", "해커스 한국사": "UCVeKJzXoDRBdmcUoe8i09PA",
        "해커스 중개사 강의": "UCTQdqmlD1ZpnvNspduztdfQ", "이중석 한국사": "UC_bh9xbdx0veC2dSOPUTp9w"
    };

    window.onload = function() {
        const container = document.getElementById('channelGrid');
        Object.entries(channels).sort().forEach(([name, id]) => {
            const btn = document.createElement('div');
            btn.className = 'channel-btn';
            btn.innerHTML = `<span>${name}</span>`;
            btn.onclick = () => fetchVideos(id, btn);
            container.appendChild(btn);
        });
    };

    async function fetchVideos(channelId, btn) {
        const dateRaw = document.getElementById('dateInput').value;
        if (dateRaw.length !== 6) { alert("날짜 6자리를 입력해주세요!"); return; }
        
        document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('resultArea');
        const videoList = document.getElementById('videoList');
        const countInfo = document.getElementById('countInfo');

        loading.style.display = 'block';
        resultArea.style.display = 'none';
        videoList.innerHTML = '';

        const uploadsPlaylistId = 'UU' + channelId.substring(2);
        const targetDate = `20${dateRaw.substring(0, 2)}-${dateRaw.substring(2, 4)}-${dateRaw.substring(4, 6)}`;
        
        let nextPageToken = "";
        let foundVideos = [];
        let pageCount = 0;
        const maxPages = 20;

        try {
            while (pageCount < maxPages) {
                const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsPlaylistId}&key=${FIXED_API_KEY}&maxResults=50&pageToken=${nextPageToken}`;
                const res = await fetch(url);
                const data = await res.json();

                if (!data.items || data.items.length === 0) break;

                const matches = data.items.filter(item => item.snippet.publishedAt.substring(0, 10) === targetDate);
                foundVideos = foundVideos.concat(matches);

                const lastDate = data.items[data.items.length - 1].snippet.publishedAt.substring(0, 10);
                if (lastDate < targetDate) break;

                nextPageToken = data.nextPageToken;
                if (!nextPageToken) break;
                pageCount++;
            }

            if (foundVideos.length > 0) {
                countInfo.innerText = `📊 총 ${foundVideos.length}개의 영상을 발견했습니다.`;
                foundVideos.forEach(item => {
                    const vId = item.snippet.resourceId.videoId;
                    const title = item.snippet.title;
                    const thumb = item.snippet.thumbnails.high.url.replace("hqdefault", "maxresdefault");
                    
                    const videoCard = document.createElement('div');
                    videoCard.className = 'video-item';
                    videoCard.innerHTML = `
                        <div class="video-title">${title}</div>
                        <img class="thumb-preview" src="${thumb}">
                        <div class="action-group">
                            <button onclick="copyTxt('https://youtu.be/${vId}')" class="action-btn btn-link"><i class="fa-solid fa-link"></i> 링크</button>
                            <button onclick="copyImg('${thumb}')" class="action-btn btn-copy"><i class="fa-solid fa-image"></i> 이미지복사</button>
                            <button onclick="downImg('${thumb}', '${dateRaw}', '${vId}')" class="action-btn btn-down"><i class="fa-solid fa-download"></i> 다운</button>
                        </div>
                    `;
                    videoList.appendChild(videoCard);
                });
                resultArea.style.display = 'block';
            } else {
                alert("해당 날짜에 업로드된 영상을 찾을 수 없습니다.");
            }
        } catch (e) {
            alert("API 호출 중 오류가 발생했습니다.");
        } finally {
            loading.style.display = 'none';
        }
    }

    async function copyTxt(txt) {
        try {
            await navigator.clipboard.writeText(txt);
            alert("✅ 링크 복사 완료!");
        } catch (err) { alert("복사 실패"); }
    }

    async function copyImg(url) {
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
            alert("🖼️ 썸네일 복사 완료! (Ctrl+V 가능)");
        } catch (e) { alert("이미지 복사 실패"); }
    }

    async function downImg(url, date, id) {
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `thumb_${date}_${id}.jpg`;
            link.click();
        } catch (e) { alert("다운로드 실패"); }
    }
</script>
</body>
</html>
